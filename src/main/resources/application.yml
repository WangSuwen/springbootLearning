# spring.application.name=springbootLearning
server:
    port: 6789
spring:
    application:
        name: springbootLearning
    profiles:
    ### 激活的环境
    # 方案一：手动控制 active的值，本地开发时dev，生产环境prod，容易出现忘了修改，直接用 dev 方式发布到线上；
    # 方案二：在命令行中指定 activeProfile，例如：java -jar springbootLearning.jar --spring.profiles.active=prod，会强行覆盖这里的dev
        active: dev
    # 方案三：通过 mave打包来控制。
    # 1、先在pom.xml 中添加如下配置：
    # <profiles>
    #     <profile>
    #         <id>dev</id>
    #         <activation>
    #             <activeByDefault>true</activeByDefault> <!-- 默认是开发环境 -->
    #         </activation>
    #         <properties>
    #             <profile.env>dev</profile.env> <!-- 定义一个变量叫 profile.env -->
    #         </properties>
    #     </profile>
    #     <profile>
    #         <id>prod</id>
    #         <properties>
    #             <profile.env>prod</profile.env>
    #         </properties>
    #     </profile>
    # </profiles>
    # 2、在application.yml文件 中添加如下配置：
        # active: @profile.env@
    # 3、 打包时指定参数：
        # 打包成开发包（默认是 dev）：mvn clean package
        # 打包成生产包：mvn clean package -Pprod （-P 代表指定哪个 profile）

    # 方案四：在docker 或 k8s 中运行，通过环境变量来指定 activeProfile，例如：-e SPRING_PROFILES_ACTIVE=prod
    # 1、在application.yml文件 中添加如下配置：如果环境变量 SPRING_PROFILES_ACTIVE 不存在，就用 dev
        # active: ${SPRING_PROFILES_ACTIVE:dev}
    # 2、在docker 或 k8s 中运行时，指定环境变量
        # docker run -e SPRING_PROFILES_ACTIVE=prod -d my-springboot-image

    datasource:
        url: jdbc:mysql://localhost:3306/spring_boot_db
        username: root
        password: 12345678
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true # 建议开启，这样你能在控制台看到它自动修改表结构的 ALTER TABLE 语句

mybatis-plus:
    configuration:
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


